command:
  nifi-system-diagnostics-check:
    exec: >-
      curl -fsS --retry 5 --retry-delay 5 --retry-all-errors
      http://nifi-0.nifi-endpoints.nifi-test.svc.cluster.local:8080/nifi-api/system-diagnostics
      | jq -e '.systemDiagnostics.aggregateSnapshot.versionInfo.niFiVersion'
    exit-status: 0
    stdout:
      - '"2.10.0"'
  nifi-flow-status-check:
    exec: >-
      curl -fsS --retry 5 --retry-delay 5 --retry-all-errors
      http://nifi-0.nifi-endpoints.nifi-test.svc.cluster.local:8080/nifi-api/flow/status
      | jq -e '.controllerStatus'
    exit-status: 0
